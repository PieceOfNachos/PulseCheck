apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsecheck-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/auth(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: auth-service
                port:
                  number: 3001
          - path: /api/monitors(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: monitoring-service
                port:
                  number: 3002
          - path: /api/notifications(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: notification-service
                port:
                  number: 3003
