name: agent

on:
  push:
    paths: ["services/agent/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["services/agent/**", ".github/workflows/agent.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/agent/requirements.txt
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r requirements.txt
      - name: Unit tests + offline evals
        env:
          AGENT_LLM: fake
          QDRANT_URL: ":memory:"
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
        run: python -m pytest -q
